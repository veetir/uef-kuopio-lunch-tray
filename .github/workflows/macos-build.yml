name: macOS Build

on:
  push:
    tags:
      - "macos-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-15-intel

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run tests
        run: |
          xcodebuild \
            -project macos/CompassLunch.xcodeproj \
            -scheme CompassLunch \
            -destination "platform=macOS" \
            test

      - name: Build universal app
        run: |
          xcodebuild \
            -project macos/CompassLunch.xcodeproj \
            -scheme CompassLunch \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -derivedDataPath build/macos \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

          app="build/macos/Build/Products/Release/LunchTray.app"
          /usr/bin/codesign --force --deep --sign - "$app"
          /usr/bin/codesign --verify --deep --strict "$app"

          archs="$(/usr/bin/lipo -archs "$app/Contents/MacOS/LunchTray")"
          [[ " $archs " == *" arm64 "* ]]
          [[ " $archs " == *" x86_64 "* ]]

      - name: Read release metadata
        run: |
          app="build/macos/Build/Products/Release/LunchTray.app"
          version="$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$app/Contents/Info.plist")"

          if [[ "$GITHUB_REF" == refs/tags/macos-v* ]]; then
            tag_version="${GITHUB_REF_NAME#macos-v}"
            if [[ "$tag_version" != "$version" ]]; then
              echo "Tag version $tag_version does not match app version $version" >&2
              exit 1
            fi
          fi

          echo "MACOS_VERSION=$version" >> "$GITHUB_ENV"

      - name: Package app
        run: |
          mkdir -p dist
          /usr/bin/ditto \
            -c -k \
            --sequesterRsrc \
            --keepParent \
            build/macos/Build/Products/Release/LunchTray.app \
            dist/LunchTray.zip
          cd dist
          shasum -a 256 LunchTray.zip > LunchTray.zip.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LunchTray-macOS-universal-${{ env.MACOS_VERSION }}
          path: |
            dist/LunchTray.zip
            dist/LunchTray.zip.sha256

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/macos-v')
        uses: softprops/action-gh-release@v2
        with:
          name: Lunch Tray for macOS v${{ env.MACOS_VERSION }}
          files: |
            dist/LunchTray.zip
            dist/LunchTray.zip.sha256
