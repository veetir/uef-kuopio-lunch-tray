[package]
name = "compass-lunch"
version = "1.4.2"
edition = "2021"
autobins = false

[features]
bench = []
perf-counters = []

[dependencies]
anyhow = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
time = { version = "0.3", features = ["local-offset"] }
windows = { version = "0.52", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_System_Console",
  "Win32_System_Registry",
  "Win32_Security",
  "Win32_System_Threading",
  "Win32_System_SystemServices",
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging"
] }

[build-dependencies]
embed-resource = "3.0"

[dev-dependencies]
criterion = "0.5"

[[bin]]
name = "compass-lunch"
path = "src/main.rs"
test = false
bench = false

[[bench]]
name = "hot_paths"
harness = false
required-features = ["bench"]
